# docker-compose.dev.yml
# Chỉ chạy PostgreSQL + Redis cho development local
# Medusa code vẫn chạy bằng: npm run backend:dev
#
# Cách dùng:
#   docker-compose -f docker-compose.dev.yml up -d
#   docker-compose -f docker-compose.dev.yml down

services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_password
      POSTGRES_DB: medusa_db
      POSTGRES_HOST_AUTH_METHOD: trust   # Dev only: bỏ qua password check
    ports:
      - "5433:5432"           # Dùng 5433 vì 5432 đã bị PostgreSQL Windows chiếm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"           # Medusa local kết nối vào đây
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
